services:
  orchestration:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.orchestration
    env_file: .env
    environment:
      LLM_SERVICE_BASE_URL: http://llm_service:8001
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/shannon
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  llm_service:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.llm_service
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/shannon
      QDRANT_URL: http://qdrant:6333
      ENABLE_VECTOR_MEMORY: "true"
    ports:
      - "8001:8001"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shannon
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shannon"]
      interval: 3s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
